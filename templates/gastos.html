<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Gastos</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Fondo con imagen */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://blossom-trade.pl/wp-content/themes/blossom-trade/assets/dist/img/food.webp') center/cover no-repeat;
            z-index: -1;
        }

        body {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .Gastos-container {
           background-color: rgba(88, 83, 89, 0.85);
            color: white;
            /* por esto no quedaba era 100 */
            width: 100%; 
            height: 500px;
            padding: 30px 50px;
            margin-top: 25px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .Gastos-container h1 {
            color: white;
            font-size: 50px;
            font-family: "DM Serif Display", serif;

        }

        thead {
            background-color: gray;
            color: white;
            border-radius: 50%;
        }

        .Botones-container {
            background-color: rgba(141, 170, 0, 0.85);
            border-radius: 15px;
            /* alinea elementos en filas o columnas */
            display: flex; 
            flex-direction: column;
            gap: 25px;
            width: 45%;
            margin-top: 25px;
            margin-left: auto;
            margin-right: -20px;
            height: 500px;
            /* deja espacio para títulos */
            padding: 15px;
            justify-content: center;
            align-items: center;

        }

        .Botones {
            width: 100%;
            height: 100%;
            max-width: 220px;
            max-height: 100px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.69);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            /*qué cambios deben animarse*/
            text-decoration: none;
            color: white;
            gap: 10px;
        }
        .Botones:hover{ /*para mi animacion*/
            transform: scale(1.1);
            background-color: rgba(122, 149, 0, 0.85);
        }
        .Botones img {
            width: 55px;
            height: 55px;
        }
    </style>
 <div class="container">
        <div class="row">
             <div class="col-md-3">
            <div class="Botones-container">
                
                <a href="{{ url_for('ventas') }}" class="Botones">
                    <img src="{{ url_for('static', filename='venta.png') }}" alt="Ventas">
                </a>
                <a href="/gastos" class="Botones">
                    <img src="{{ url_for('static', filename='gastos.png') }}" alt="Gastos">
                    
                </a>
                <a href="/caja" class="Botones">
                    <img src="{{ url_for('static', filename='caja.png') }}" alt="Caja">
                    
                </a>
                <a href="/inventario" class="Botones">
                    <img src="{{ url_for('static', filename='inventario.png') }}" alt="Inventario">
                </a>
                <a href="/logout" class="Botones" img>
                        <img src="{{ url_for('static', filename='logout.png') }}" alt="Logout">
                    </a>
            </div>
        </div>
            <div class="col-md-auto">
                <div class="Gastos-container">
                    <h1>Fruteria "El divino niño"</h1>
                    <table border="2" style="width:100%; margin-top: 25px; text-align: center; border-radius: 50%;">
                        <thead>
                            <tr>
                                <th style="border:1px solid black;">Servicio</th> <!-- Para darle borde a cada uno -->
                                <th style="border:1px solid black;">Precio</th>
                                <th style="border:1px solid black;">Fecha</th>
                                <th style="border:1px solid black;">Hora</th>
                                
                            </tr>
                        </thead>
                        <tbody>
                            {% for venta in Ventas %}
                            <tr class="Table-active">
                                
                                <td style="border:1px solid black;">{{ gasto[0] }}</td>
                                <td style="border:1px solid black;">{{ gasto[1] }}</td>
                                <td style="border:1px solid black;">{{ gasto[2] }}</td>
                                <td style="border:1px solid black;">{{ gasto[3] }}</td>

                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    <div style="margin-top: 20px; text-align: right; font-size: 20px; font-weight: bold;">
                    Gastos Totales: ${{ Total }}
                    </div>

                </div>
            </div>
            
        </div>
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</body>

</html>
