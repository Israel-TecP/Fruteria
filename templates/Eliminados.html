<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Productos Eliminados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Fondo con imagen */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("static/Dark Green and White Modern Minimalist Nature Presentation.jpg") center/cover no-repeat;
            z-index: -1;
        }

        body {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            /* por esto no quedaba era 100 */
            width: 170%;
            max-width: 1100px;
            padding: 10px 30px;
            margin-top: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: left;
            /* para moverlo */
            margin-left: -60%;
        }

        .container h1 {
            color: white;
            font-size: 40px;
            font-family: "DM Serif Display", serif;
            margin-bottom: 20px;
        }

        thead {
            background-color: gray;
            color: white;
        }

        .main-panel {
            margin-left: 10%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            max-width: 1100px;
            margin-top: 25px;
        }
        </style>
</head>
<body>
    <div background="lightgray"></div>
    <div class="main-panel">
        <h2 style="color: white;">Productos Eliminados</h2>
        <table class="table table-dark table-hover" style="border:1px solid black; width: 100%; padding: auto;">
            <thead>
                <tr>
                    <th style="border:1px solid black;">Código</th>
                    <th style="border:1px solid black;">Nombre</th>
                    <th style="border:1px solid black;">Precio</th>
                    <th style="border:1px solid black;">Cantidad</th>
                    <th style="border:1px solid black;">Categoría</th>
                    <th style="border:1px solid black;">T_Emboltura</th>
                    <th style="border:1px solid black;">Merma</th>
                    <th style="border:1px solid black;">Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for producto in eliminados %}
                <tr>
                    <td style="border:1px solid black;">{{ producto[0] }}</td>
                    <td style="border:1px solid black;">{{ producto[1] }}</td>
                    <td style="border:1px solid black;">{{ producto[2] }}</td>
                    <td style="border:1px solid black;">{{ producto[3] }}</td>
                    <td style="border:1px solid black;">{{ producto[4] }}</td>
                    <td style="border:1px solid black;">{{ producto[5] }}</td>
                    <td style="border:1px solid black;">{{ producto[6] }}</td>
                    <td style="border:1px solid black;">
                        <form action="/restaurar_producto" method="POST">
                            <input type="hidden" name="codigo_restaurar" value="{{ producto[0] }}">
                            <button type="submit" class="btn btn-primary btn-sm"
                                onclick="return confirm('¿Estás seguro de que deseas restaurar este producto?');">
                                Restaurar
                            </button>
                        </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="d-flex justify-content-end">
            <a href="/inventario" class="btn btn-secondary">Volver al Inventario</a>
        </div>
    </div>
</body>
</html>
