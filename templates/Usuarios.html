<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seleccionar usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #111; color: white; text-align: center; }
    .perfil-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; margin-top: 50px; }
    .perfil { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; cursor: pointer; transition: 0.3s; border: 3px solid transparent; }
    .perfil:hover { border-color: #0f0; transform: scale(1.1); }
    .perfil img { width: 100%; height: 100%; object-fit: cover; }
    .nuevo { background: rgba(255,255,255,0.1); border: 2px dashed #aaa; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <h2>Elige tu usuario</h2>
<div class="perfil-container">
  {% for u in usuarios %}
    <form action="{{ url_for('login') }}" method="POST">
      <input type="hidden" name="nombre" value="{{ u[1] }}">
      <button class="perfil" type="submit" title="{{ u[1] }}">
        <img src="{{ url_for('static', filename='uploads/' + (u[3] if u[3] else 'default.png')) }}">
      </button>
    </form>
  {% endfor %}
</div>


    <!-- Crear nuevo usuario -->
    <div class="perfil nuevo" data-bs-toggle="modal" data-bs-target="#nuevoUsuarioModal">
      <span style="font-size: 2em;">+</span>
    </div>
  </div>

  <!-- Modal crear usuario -->
  <div class="modal fade" id="nuevoUsuarioModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-light p-3 rounded">
        <form action="/crear_usuario" method="POST" enctype="multipart/form-data">
          <h4>Nuevo usuario</h4>
          <label>Nombre de usuario</label>
          <input name="nombre" class="form-control mb-2" required>

          <label>Contraseña</label>
          <input name="contraseña" type="password" class="form-control mb-2" required>

          <label>Rol</label>
          <select name="rol" id="rol" class="form-select mb-3">
            <option value="EMPLEADO">Empleado</option>
            <option value="ADMIN">Administrador</option>
          </select>

          <div id="permisos" style="display:none;">
            <label><input type="checkbox" name="ventas"> Permitir usar ventas</label><br>
            <label><input type="checkbox" name="caja"> Acceder a caja</label><br>
            <label><input type="checkbox" name="inventario"> Acceder a inventario</label><br>
          </div>

          <label>Foto de perfil (opcional)</label>
          <input type="file" name="foto" class="form-control mb-3" accept="image    /*">

          <button class="btn btn-success w-100">Crear usuario</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('rol').addEventListener('change', function() {
      document.getElementById('permisos').style.display = this.value === 'EMPLEADO' ? 'block' : 'none';
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
