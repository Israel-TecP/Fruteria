<html>
  <head>
    <meta charset="UTF-8">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      body { background: #111; color: white; text-align: center; }
      .perfil-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; margin-top: 50px; }
      .perfil { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; cursor: pointer; transition: 0.3s; border: 3px solid transparent; }
      .perfil:hover { border-color: #0f0; transform: scale(1.1); }
    .perfil img { width: 100%; height: 100%; object-fit: cover; }
    .nuevo { background: rgba(255,255,255,0.1); border: 2px dashed #aaa; display: flex; align-items: center; justify-content: center; }
  </style>

<body>
    



<!-- Modal de usuarios -->
<div class="modal fade" id="modalUsuarios" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content bg-light text-dark p-4 rounded">
      <h4>Usuarios del sistema</h4>
      <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
        {% for u in usuarios %}
        <div class="text-center">
          <button class="btn p-0" data-bs-toggle="modal" data-bs-target="#modalEditar{{ u[0] }}">
            <img src="{{ url_for('static', filename='uploads/' + (u[5] or 'default.png')) }}"
                 class="rounded-3 border shadow"
                 style="width: 120px; height: 120px; object-fit: cover;">
          </button>
          <p class="fw-bold mt-2">{{ u[1] }}</p>
        </div>

        <!-- Modal editar usuario -->
        <div class="modal fade" id="modalEditar{{ u[0] }}" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content bg-white text-dark p-3 rounded">
              <form action="/editar_usuario" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="id_usuario" value="{{ u[0] }}">
                <input type="hidden" name="foto_actual" value="{{ u[5] }}">

                <h5>Editar Usuario</h5>
                <label>Nombre</label>
                <input name="nombre" class="form-control mb-2" value="{{ u[1] }}">

                <label>Contraseña</label>
                <input name="contrasena" class="form-control mb-2" value="{{ u[2] }}">

                <label>Rol</label>
                <select name="rol" class="form-select mb-2">
                  <option value="ADMIN" {% if u[3]=='ADMIN' %}selected{% endif %}>Administrador</option>
                  <option value="EMPLEADO" {% if u[3]=='EMPLEADO' %}selected{% endif %}>Empleado</option>
                </select>

                <label>Estado</label>
                <select name="estado" class="form-select mb-2">
                  <option value="ACTIVO" {% if u[4]=='ACTIVO' %}selected{% endif %}>Activo</option>
                  <option value="INACTIVO" {% if u[4]=='INACTIVO' %}selected{% endif %}>Inactivo</option>
                </select>

                <label>Foto</label>
                <input type="file" name="foto" class="form-control mb-3" accept="image/*">

                <button class="btn btn-success w-100">Guardar cambios</button>
              </form>
            </div>
          </div>
        </div>
        {% endfor %}

        <!-- Botón crear -->
        <div class="text-center">
          <button class="btn btn-outline-primary p-0 d-flex align-items-center justify-content-center"
                  style="width: 120px; height: 120px;" data-bs-toggle="modal" data-bs-target="#modalCrear">
            <span style="font-size: 48px;">＋</span>
          </button>
          <p class="fw-bold mt-2">Nuevo</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal crear usuario -->
<div class="modal fade" id="modalCrear" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-white text-dark p-3 rounded">
      <form action="/crear_usuario" method="POST" enctype="multipart/form-data">
        <h5>Crear nuevo usuario</h5>
        <label>Nombre</label>
        <input name="nombre" class="form-control mb-2" required>

        <label>Contraseña</label>
        <input name="contrasena" class="form-control mb-2" required>

        <label>Rol</label>
        <select name="rol" class="form-select mb-2">
          <option value="ADMIN">Administrador</option>
          <option value="EMPLEADO">Empleado</option>
        </select>

        <label>Estado</label>
        <select name="estado" class="form-select mb-2">
          <option value="ACTIVO">Activo</option>
          <option value="INACTIVO">Inactivo</option>
        </select>

        <label>Foto</label>
        <input type="file" name="foto" class="form-control mb-3" accept="image/*">

        <button class="btn btn-success w-100">Crear usuario</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
                crossorigin="anonymous"></script>
</body>
</html>
