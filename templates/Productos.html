<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Productos - Frutería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Fondo con imagen */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://blossom-trade.pl/wp-content/themes/blossom-trade/assets/dist/img/food.webp') center/cover no-repeat;
            z-index: -1;
        }

        body {
            background-color: rgba(255, 255, 255, 0.1);
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            background: #8a9a22;
            color: black;
            padding: 10px;
            border-radius: 20px;
            font-family: Georgia, serif;
        }

        .buscar {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .buscar input {
            padding: 10px;
            border-radius: 20px;
            border: none;
            width: 50%;
            background: #d3d3d3;
            text-align: center;
        }

        table {
            width: 90%;
            margin-left: auto;
            margin-right: auto;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background: #8a9a22;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #ccc;
            padding: 8px;
        }

        .btn-agregar {
            background: #8a9a22;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }

        .btn-agregar:hover {
            background: #6f7c1b;
        }

        .btn-cancelar {
            display: block;
            margin: 20px auto;
            background: #f5b700;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            padding: 12px 40px;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-cancelar:hover {
            background: #e0a500;
        }
    </style>
</head>

<body>

    <h1>Productos</h1>

    <div class="buscar">
        <input type="text" placeholder="Buscar por código">
    </div>

    <table class="table table-success table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Existencias</th>
                <th>Código</th>
                <th>Cantidad a agregar</th>
            </tr>
        </thead>
        <tbody>
            {% for producto in Productos %}
            <tr>
                <td>{{ producto[0] }}</td>
                <td>{{ producto[1] }}</td>
                <td>{{ producto[2] }}</td>
                <td>{{ producto[3] }}</td>
                <td>{{ producto[4] }}</td>
                <td>
                    <form action="{{ url_for('agregar_producto') }}" method="post">
                        <input type="hidden" name="nombre" value="{{ producto[0] }}">
                        <input type="hidden" name="categoria" value="{{ producto[1] }}">
                        <input type="hidden" name="precio" value="{{ producto[2] }}">
                        <input type="hidden" name="codigo" value="{{ producto[4] }}">
                        <input type="number" name="cantidad" value="1" min="1" max="{{ producto[3] }}" required>
                        <button type="submit" class="btn-agregar">Agregar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>


    </table>

    <a href="/ventas" class="btn btn-primary">Cancelar</a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
